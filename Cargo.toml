[package]
name = "rm-progress"
version = "0.1.0"
description = "rmp: a parallel rm that counts first, then deletes with a progress bar."
edition = "2024"
homepage = "https://github.com/CleanCut/rm-progress"
repository = "https://github.com/CleanCut/rm-progress"
readme = "README.md"
keywords = ["rm", "delete", "parallel", "progress", "cli"]
categories = ["command-line-utilities", "filesystem"]
license = "MIT"
exclude = ["/.github", "release.toml", "RELEASE.md", "rustfmt.toml", ".gitignore", ".editorconfig"]

[[bin]]
name = "rmp"
path = "src/main.rs"

[dependencies]
console = { version = "0.16", default-features = false, features = ["std"] }
indicatif = { version = "0.18", default-features = false }
rayon = "1.12"
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSURL",
  "NSValue",
] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
