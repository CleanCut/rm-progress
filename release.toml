pre-release-hook = ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
pre-release-commit-message = "{{crate_name}} {{version}}"
tag-message = "{{tag_name}}"
tag-name = "{{prefix}}v{{version}}"
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}", min = 1 },
    { file = "CHANGELOG.md", search = "\\.\\.\\.HEAD", replace = "...{{tag_name}}", min = 0 },
    { file = "CHANGELOG.md", search = "commits/main", replace = "releases/tag/{{tag_name}}", min = 0 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## [Unreleased] - ReleaseDate\n", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/CleanCut/rm-progress/compare/{{tag_name}}...HEAD", exactly = 1 },
]
